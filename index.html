<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;padding:0 14px 40px}
header{padding:14px 2px 6px;font-weight:800;font-size:20px;color:var(--pk);letter-spacing:.05em}
header small{display:block;color:var(--sub);font-weight:400;font-size:12px;letter-spacing:0}
.stage{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;min-height:220px;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}

.tabs,.shades{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}

.chip.on{background:var(--pk);color:#fff;border-color:var(--pk)}
.prods{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.pc{flex:none;width:132px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;cursor:pointer}
.pc.on{outline:2px solid var(--pk)}

.sh i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 4px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd)}
.sh.on i{box-shadow:0 0 0 3px var(--pk)}.sh.on{color:var(--tx);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:6px}
.nm{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--sub);margin:3px 0}
.row{display:flex;gap:8px;margin-top:8px}.row .btn{flex:1}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px;padding:4px;cursor:pointer}nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--pk);font-weight:700}#app{padding-bottom:90px}.li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}.li .sw{width:44px;height:44px;border-radius:12px;flex:none}.li .g{flex:1;min-width:0}.pct{background:var(--pk2);color:var(--pk);font-weight:800;border-radius:10px;padding:5px 8px;font-size:12px;text-align:center}.note{font-size:11px;color:var(--sub);line-height:1.6;margin-top:12px}
</style></head><body><div id="app">
<header>ME FIT<small id="sub"></small></header>
<div id="notice" role="status" aria-live="polite"></div>

<p class="note">※ 色データがある色番は顔写真で試せます。「色データ準備中」の商品もお気に入りに保存できます。画面の色は参考色で、実物の発色とは異なります。価格は収集時点の情報です。購入先でご確認ください。<br>※ 公式色見本から採った推定色を含みます。パレットは代表1色で表示し、ラメ・質感・複数色の重なりは再現しません。</p>
<input type="file" id="file" accept="image/*" hidden>
</div>

<script>
const D={
lip:{label:"リップ",items:[

{id:"lt",b:"KATE",n:"リップモンスター ツヤバース",price:"",tag:"新作",c:"#d6667f",sh:[["G01","明後日の水たまり","#c4233f"],["G02","ピンクムーンの雫","#f08272"],["G03","99.9℃","#b5573a"],["G05","ピンクロビンの泉","#d6667f"],["G06","歓喜予報","#a92a4a"],["G07","夕暮れの体温","#a65a3c"]]},
{id:"rj",b:"rom&nd",n:"ジューシーラスティングティント",price:"¥1,320",tag:"SNSで話題",c:"#d9467c",sh:[["04","DRAGON PINK","#d9467c"],["06","FIGFIG","#b0586a"],["11","PINK PUMPKIN","#e0735f"],["37","MELLOW PEAR","#c98e7a"]]},
{id:"ot",b:"OPERA",n:"リップティント N",price:"",tag:"定番",c:"#f08a7e",sh:[["05","コーラルピンク","#f08a7e"],["06","ピンクレッド","#d9476a"],["11","フィグ","#b24a58"],["12","プラムピンク","#b4577c"],["13","トープ","#b0826f"]]},

cheek:{label:"チーク",items:[
{id:"bc",b:"KATE",n:"バウンシーチークシャドウ",price:"",tag:"ベストコスメ",c:"#f08aa0",sh:[["PK-1","","#f08aa0"],["EX-1","パーピンク","#cc7fb5"],["EX-2","ミャオピンク","#f2899a"]]},
{id:"cc",b:"CANMAKE",n:"クリームチーク",price:"¥638",tag:"殿堂入り",c:"#e8667f",sh:[["02","チェリーピンク","#e8667f"],["03","ストロベリーホイップ","#ef8a98"],["05","スウィートアプリコット","#f4a279"],["07","コーラルオレンジ","#f08068"],["08","マシュマロピンク","#f4a6b8"],["09","ピンキーローズ","#d9718c"],["10","スウィートオレンジ","#f59a62"],["25","さくらんぼホイップ","#e87a8c"]]},
{id:"cu",b:"自分で指定",n:"好きな色で試す",price:"",tag:"お手持ちのコスメに",c:"#f08aa0",sh:[["","自分で指定","#f08aa0"]]}]},

{id:"cu",b:"自分で指定",n:"好きな色で試す",price:"",tag:"お手持ちのコスメに",c:"#a0526a",sh:[["","自分で指定","#a0526a"]]}]},

{id:"cu",b:"自分で指定",n:"好きな色で試す",price:"",tag:"お手持ちのコスメに",c:"#8a5f55",sh:[["","自分で指定","#8a5f55"]]}]}};
const S={cat:"lip",prod:"lm",ap:{},img:null,pts:[],before:false,selections:{},editors:{},auto:true,lm:null,brand:"すべて",cmp:null,k:.8,tone:null,skinL:0,view:"rec",f:"すべて",q:"",sort:"default"};
const $=id=>document.getElementById(id);
const prodOf=(c,id)=>D[c].items.find(p=>p.id==id)||D[c].items[0];
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function soft(x,cx,cy,rx,ry,rot,col,a,hard){x.save();x.translate(cx,cy);x.rotate(rot);x.scale(rx,ry);const g=x.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,rgba(col,a));g.addColorStop(hard,rgba(col,a*.9));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.beginPath();x.arc(0,0,1,0,7);x.fill();x.restore()}
function layer(x,ap){let [A,B,M]=S.pts;if(A[0]>B[0])[A,B]=[B,A];const dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),u=[Math.cos(a),Math.sin(a)],v=[-Math.sin(a),Math.cos(a)],k=S.k;
const P=(E,q,l)=>[E[0]+v[0]*q*d+u[0]*l*d,E[1]+v[1]*q*d+u[1]*l*d];
x.save();x.globalCompositeOperation="multiply";
if(ap.cheek){[P(A,.55,-.12),P(B,.55,.12)].forEach(c=>soft(x,c[0],c[1],.32*d,.27*d,a,ap.cheek,.55*k,.05))}
if(ap.lip){if(S.auto&&S.lm){const t=document.createElement("canvas");t.width=x.canvas.width;t.height=x.canvas.height;const g=t.getContext("2d");g.drawImage(S.lm,0,0);g.globalCompositeOperation="source-in";g.fillStyle=ap.lip;g.fillRect(0,0,t.width,t.height);x.save();x.globalAlpha=Math.min(1,.9*k);x.drawImage(t,0,0);x.restore()}else soft(x,M[0],M[1],.3*d,.09*d,a,ap.lip,.85*k,.7)}
if(ap.brow){[A,B].forEach(E=>{const c=P(E,-.34,0);soft(x,c[0],c[1],.36*d,.05*d,a,ap.brow,.6*k,.6)})}
x.restore();
if(ap.eye){const t=document.createElement("canvas");t.width=x.canvas.width;t.height=x.canvas.height;const g=t.getContext("2d");
[[A,-1],[B,1]].forEach(([E,s])=>{const c=P(E,-.115,s*.03),l=P(E,.09,s*.03);soft(g,c[0],c[1],.28*d,.08*d,a,ap.eye,.9*k,.45);soft(g,l[0],l[1],.2*d,.035*d,a,ap.eye,.45*k,.4)});
g.globalCompositeOperation="destination-out";[A,B].forEach(E=>soft(g,E[0],E[1],.23*d,.075*d,a,"#000000",1,.75));
x.save();x.globalCompositeOperation="multiply";x.drawImage(t,0,0);x.restore()}}
function draw(){const cv=$("cv");if(!cv)return;const x=cv.getContext("2d");x.drawImage(S.img,0,0,cv.width,cv.height);
if(S.pts.length<3){S.pts.forEach(p=>{x.fillStyle="#e0527a";x.beginPath();x.arc(p[0],p[1],6,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=2;x.stroke()});return}
if(S.before)return;
if(S.cmp){x.save();x.beginPath();x.rect(cv.width/2,0,cv.width/2,cv.height);x.clip();x.drawImage(S.img,0,0,cv.width,cv.height);layer(x,S.ap);x.restore();
x.fillStyle="#fff";x.fillRect(cv.width/2-1,0,2,cv.height);x.font="bold 22px sans-serif";x.fillText("元",12,30);x.fillText("試す",cv.width/2+12,30)}
else layer(x,S.ap)}
function load(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{S.img=im;S.pts=[];S.lm=null;S.tone=null;S.skinL=0;S.skinRG=0;S.before=false;S.cmp=false;renderStage();ui()};im.src=r.result};r.readAsDataURL(f)}
$("file").onchange=e=>e.target.files[0]&&load(e.target.files[0]);
function renderStage(){const st=$("stage");
if(!S.img){st.innerHTML=`<div class="empty"><p>自分の顔写真（正面・明るい場所）を選ぶと、コスメを重ねて試せます。<br>写真はこの端末の中だけで使い、送信・保存はしません。</p><button class="btn" onclick="$('file').click()">顔写真を選ぶ</button></div>`;msg();return}
const w=Math.min(S.img.width,900),h=Math.round(S.img.height*w/S.img.width);
st.innerHTML=`<canvas id="cv" width="${w}" height="${h}"></canvas>`;const cv=$("cv");
cv.onclick=e=>{if(S.pts.length>=3)return;const r=cv.getBoundingClientRect();S.pts.push([(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]);draw();if(S.pts.length==3)analyze();msg();view()};
const on=v=>{if(S.pts.length<3)return;S.before=v;draw();msg()};
cv.onpointerdown=()=>on(true);["pointerup","pointerleave","pointercancel"].forEach(t=>cv.addEventListener(t,()=>S.before&&on(false)));
draw();msg()}
function msg(){const m=$("msg"),n=S.pts.length;
if(!S.img){m.innerHTML="";return}
if(n<3){m.innerHTML=`位置合わせ：<b>${["① 片方の目","② もう片方の目","③ 口の中心"][n]}</b>をタップ`;return}
m.innerHTML=(S.before?"<b>Before</b>（離すとAfter）":"画像を長押しで <b>Before</b> を確認")+` ／ <a href="#" onclick="S.pts=[];S.lm=null;S.tone=null;S.before=false;draw();msg();return false" style="color:var(--pk)">位置を取り直す</a> ／ <a href="#" onclick="$('file').click();return false" style="color:var(--pk)">写真を変更</a>`+(S.auto&&S.lm?" ／ 口の形：自動補正":" ／ 口の形：標準")}
function selectPart(cat){
S.editors[S.cat]={pid:S.prod,brand:S.brand};
S.cat=cat;const editor=S.editors[cat];
S.prod=editor?editor.pid:D[cat].items[0].id;S.brand=editor?editor.brand:"すべて";
ui()}
function pickShade(i){const p=prodOf(S.cat,S.prod);if(!p.sh[i])return;S.selections[S.cat]={pid:p.id,i};if(Catalog.isColor(p.sh[i][2]))S.ap[S.cat]=p.sh[i][2];else delete S.ap[S.cat];draw();ui()}
function pickCustom(color){S.ap[S.cat]=color;S.selections[S.cat]={pid:"cu",color};draw();ui()}
function clearPart(){delete S.ap[S.cat];delete S.selections[S.cat];draw();ui()}
function plist(){const l=D[S.cat].items.filter(p=>S.brand=="すべて"||p.b==S.brand);return l.length?l:D[S.cat].items}
const h=value=>Catalog.escape(value);
const displayCode=(p,s)=>p.shadeMeta?.[s[0]]?.code??s[0];
const swatch=color=>Catalog.isColor(color)?`background:${color}`:"background:repeating-linear-gradient(135deg,var(--pk2),var(--pk2) 5px,var(--card) 5px,var(--card) 10px)";
function ui(){
$("brands").innerHTML=["すべて",...new Set(D[S.cat].items.map(p=>p.b))].map(b=>`<button class="chip ${S.brand===b?"on":""}" aria-pressed="${S.brand===b}" data-action="brand" data-brand="${h(b)}" style="font-size:12px;padding:5px 10px">${h(b)}</button>`).join("");
$("tabs").innerHTML=Object.keys(D).map(k=>`<button class="chip ${S.cat===k?"on":""}" aria-pressed="${S.cat===k}" data-action="part" data-cat="${k}">${D[k].label}<small>${S.ap[k]?"メイクを選択中":S.selections[k]?"色番を選択中":"まだ選択していません"}</small></button>`).join("");
$("prods").innerHTML=plist().map(p=>`<div class="pc ${S.prod===p.id?"on":""}" role="button" tabindex="0" data-action="product" data-pid="${p.id}"><div class="pkg" style="padding:0;flex-direction:row;overflow:hidden">${p.sh.map(s=>`<i style="flex:1;height:100%;${swatch(s[2])}"></i>`).join("")}</div><div class="n">${h(p.n)}</div>${p.tag?`<div class="t">${h(p.tag)}</div>`:""}</div>`).join("");
const p=prodOf(S.cat,S.prod),selection=S.selections[S.cat],sel=selection&&selection.pid===p.id&&Number.isInteger(selection.i)?selection.i:-1;
$("shades").innerHTML=p.id==="cu"?`<span class="meta">色を指定 →</span><input aria-label="自分で指定する色" type="color" value="${selection&&selection.pid==="cu"?selection.color:p.sh[0][2]}" oninput="pickCustom(this.value)" style="width:64px;height:44px;border:0;background:none">`:p.sh.map((s,i)=>`<button class="sh ${sel===i?"on":""}" aria-pressed="${sel===i}" style="border:0;background:none;padding:4px" data-action="shade" data-index="${i}"><i style="${swatch(s[2])}"></i>${h(displayCode(p,s))}<br>${h(s[1])}${!Catalog.isColor(s[2])?"<br>色データ準備中":""}</button>`).join("");

const SUBT={rec:"おすすめを見る",try:"好きなパーツを選んで、自由に試す",fav:"お気に入りの商品・色番"};
const FAVORITES_KEY="mefit.favorites.v1";
function favoriteItem(entry){
if(!entry||typeof entry!=="object"||typeof entry.cat!=="string"||typeof entry.pid!=="string"||typeof entry.code!=="string"||!Object.hasOwn(D,entry.cat))return null;
const p=D[entry.cat].items.find(p=>p.id==entry.pid&&p.id!="cu");if(!p)return null;
const i=p.sh.findIndex(s=>s[0]===entry.code);return i<0?null:{cat:entry.cat,p,i,s:p.sh[i]}}
function readFavorites(){try{const raw=localStorage.getItem(FAVORITES_KEY);if(raw===null)return [];const entries=JSON.parse(raw);if(!Array.isArray(entries))throw new Error("Invalid favorites");const seen=new Set();return entries.filter(entry=>{if(!entry||!Object.hasOwn(D,entry.cat)||typeof entry.pid!=="string"||!/^[a-z0-9_]+$/i.test(entry.pid)||typeof entry.code!=="string")return false;const key=JSON.stringify([entry.cat,entry.pid,entry.code]);if(seen.has(key))return false;seen.add(key);return true}).map(({cat,pid,code})=>({cat,pid,code}))}catch(e){$("notice").textContent="お気に入りを読み込めませんでした。ブラウザーの保存設定をご確認ください。";return []}}
let favorites=readFavorites();
function isFavorite(cat,pid,code){return favorites.some(f=>f.cat===cat&&f.pid===pid&&f.code===code)}
function toggleFavorite(cat,pid,i){
const p=D[cat]?.items.find(p=>p.id===pid&&p.id!=="cu"),s=p?.sh[i];if(!s)return;
const next=isFavorite(cat,pid,s[0])?favorites.filter(f=>!(f.cat===cat&&f.pid===pid&&f.code===s[0])):[...favorites,{cat,pid,code:s[0]}];
try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(next));favorites=next;$("notice").textContent="";ui();if(S.view=="fav")renderFavorites()}catch(e){$("notice").textContent="お気に入りを保存できませんでした。ブラウザーの保存設定をご確認ください。"}}
function renderFavorites(){
const items=favorites.map(favoriteItem).filter(Boolean);
$("favV").innerHTML='<p class="meta">お気に入りはこのブラウザーに保存されます。写真は保存しません。</p>'+(items.length?items.map(({cat,p,s,i})=>`<div class="card favorite-card"><div class="favorite-head"><div class="sw" style="${swatch(s[2])}"></div><div class="g"><div class="meta">${D[cat].label}</div><div class="nm">${h(p.b)} ${h(p.n)}</div><div class="meta">${h(displayCode(p,s))} ${h(s[1])}</div><div class="meta">${p.price?"税込 "+h(p.price):"価格は未登録"}</div>${!Catalog.isColor(s[2])?'<div class="meta">色データ準備中</div>':""}</div><button class="heart" aria-label="${h(p.b)} ${h(p.n)} ${h(displayCode(p,s))}をお気に入りから削除" aria-pressed="true" data-action="favorite" data-cat="${cat}" data-pid="${p.id}" data-index="${i}">♥</button></div><div class="row"><button class="btn g" data-action="go" data-cat="${cat}" data-pid="${p.id}" data-index="${i}">もう一度試す</button><a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(p.b+" "+p.n+" "+displayCode(p,s)+" "+s[1])}">購入先を探す</a></div></div>`).join(""):'<div class="empty"><p>まだお気に入りはありません。<br>「試す」で好きな色番を選び、♡で保存してください。</p><button class="btn" onclick="S.view=&quot;try&quot;;view()">メイクを試す</button></div>')}

const rgbOf=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const hueOf=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx==mn)return 0;let h=mx==r?(g-b)/(mx-mn):mx==g?2+(b-r)/(mx-mn):4+(r-g)/(mx-mn);h*=60;return h<0?h+360:h};
const warm=h=>{const v=hueOf(...rgbOf(h));return v>=8&&v<50?"warm":(v>=285||v<8)?"cool":"mid"};
const tword=h=>{const [r,g,b]=rgbOf(h),v=hueOf(r,g,b),l=(r+g+b)/765,w=warm(h);const f=v>=285&&v<335?"ピンク・ベリー系":(v>=335||v<8)?"ローズ・レッド系":v<22?"コーラル・テラコッタ系":v<50?"ブラウン・ベージュ系":"グレージュ系";return (l<.38?"深め":l>.6?"明るめ":"中間の明るさ")+"の"+f+"（"+(w=="warm"?"黄みより":w=="cool"?"青みより":"中間")+"）"};
const score=h=>{if(!S.tone)return null;const w=warm(h),k=parseInt(h.slice(1),16)%7;return w==S.tone?90+k:w=="mid"?82+k:72+k};

const FEAT={rj:"ツヤと色持ちが人気のティントリップ。フルーツから着想を得た豊富な色展開です。",ot:"唇の水分に反応して色づく、透け感のあるティントのリップスティック。マスクにつきにくい処方です。",cc:"クリームジェルタイプのチーク。塗った瞬間サラサラになり、肌の内側からにじむように発色します。",cu:"お手持ちのコスメの色に合わせて、好きな色を指定して試せます。",lm:"発売以来人気の定番リップ。全7色＋WEB限定色の展開です。",lt:"リップモンスターのツヤ感のあるライン。色ごとにパーソナルカラー別のおすすめ色が紹介されています。",bc:"ほほにのせるチークシャドウ。PK-1はマキア ベストコスメ2026上半期 プチプラ部門1位です。",ec:"パール・マット・グリッターなど質感が豊富な単色アイシャドウ。好きな色を組み合わせて使えます。",bw:"パウダリーな仕上がりのアイブロウペンシルです。"};
function lipMask(){const cv=$("cv"),W=cv.width,H=cv.height,t=document.createElement("canvas");t.width=W;t.height=H;const x=t.getContext("2d",{willReadFrequently:true});x.drawImage(S.img,0,0,W,H);
let [A,B,M]=S.pts;if(A[0]>B[0])[A,B]=[B,A];const d=Math.hypot(B[0]-A[0],B[1]-A[1]),a=Math.atan2(B[1]-A[1],B[0]-A[0]),ux=Math.cos(a),uy=Math.sin(a),vx=-uy,vy=ux;
const R=Math.ceil(.8*d),x0=Math.max(0,Math.round(M[0]-R)),y0=Math.max(0,Math.round(M[1]-R)),x1=Math.min(W,Math.round(M[0]+R)),y1=Math.min(H,Math.round(M[1]+R)),w=x1-x0,h=y1-y0;if(w<10||h<10)return null;
const p=x.getImageData(x0,y0,w,h).data,n=w*h,rg=new Float32Array(n),lu=new Float32Array(n);
for(let i=0;i<n;i++){rg[i]=p[4*i]-p[4*i+1];lu[i]=(p[4*i]+p[4*i+1]+p[4*i+2])/3}
let cx=M[0]-x0,cy=M[1]-y0,m=new Float32Array(n),cnt=0;
for(let it=0;it<2;it++){const c=[],vals=[];
for(let j=0;j<h;j++)for(let i=0;i<w;i++){const du=(i-cx)*ux+(j-cy)*uy,dv=(i-cx)*vx+(j-cy)*vy,k=j*w+i;if((du/(.5*d))**2+(dv/(.32*d))**2<=1&&lu[k]>50){c.push(k);vals.push(rg[k])}}
if(c.length<20)return null;vals.sort((a,b)=>a-b);const p90=vals[Math.floor(vals.length*.9)];
if(p90-S.skinRG<14)return null;const thr=S.skinRG+.45*(p90-S.skinRG);
m.fill(0);cnt=0;let sx=0,sy=0;c.forEach(k=>{if(rg[k]>=thr){m[k]=1;cnt++;sx+=k%w;sy+=Math.floor(k/w)}});
if(cnt<.015*d*d)return null;cx=sx/cnt;cy=sy/cnt}
const r=Math.max(1,Math.round(d*.012));
for(let pass=0;pass<2;pass++){const o=new Float32Array(n);for(let j=0;j<h;j++)for(let i=0;i<w;i++){let q=0,z=0;for(let e=-r;e<=r;e++){const ii=i+e;if(ii>=0&&ii<w){q+=m[j*w+ii];z++}}o[j*w+i]=q/z}
const o2=new Float32Array(n);for(let j=0;j<h;j++)for(let i=0;i<w;i++){let q=0,z=0;for(let e=-r;e<=r;e++){const jj=j+e;if(jj>=0&&jj<h){q+=o[jj*w+i];z++}}o2[j*w+i]=q/z}m=o2}
const out=document.createElement("canvas");out.width=W;out.height=H;const g=out.getContext("2d"),id=g.createImageData(w,h);
for(let i=0;i<n;i++){id.data[4*i]=id.data[4*i+1]=id.data[4*i+2]=255;id.data[4*i+3]=Math.min(255,m[i]*300)}
g.putImageData(id,x0,y0);return out}
function analyze(){const cv=$("cv"),t=document.createElement("canvas");t.width=cv.width;t.height=cv.height;const x=t.getContext("2d");x.drawImage(S.img,0,0,t.width,t.height);
let [A,B]=S.pts;if(A[0]>B[0])[A,B]=[B,A];const d=Math.hypot(B[0]-A[0],B[1]-A[1]),a=Math.atan2(B[1]-A[1],B[0]-A[0]),vx=-Math.sin(a),vy=Math.cos(a);
let r=0,g=0,b=0,n=0;[A,B].forEach(E=>{const cx=E[0]+vx*.85*d,cy=E[1]+vy*.85*d,k=Math.max(4,Math.round(.12*d));try{const im=x.getImageData(Math.round(cx-k),Math.round(cy-k),2*k,2*k).data;for(let i=0;i<im.length;i+=4){r+=im[i];g+=im[i+1];b+=im[i+2];n++}}catch(e){}});
if(!n)return;r/=n;g/=n;b/=n;S.skinL=(r+g+b)/765;S.skinRG=r-g;S.tone=hueOf(r,g,b)<20?"cool":"warm";try{S.lm=lipMask()}catch(e){S.lm=null}}
function allProducts(){const rows=[];for(const k in D)for(const p of D[k].items)if(p.id!=="cu")rows.push({k,p});return rows}
function go(k,pid,i){S.editors[S.cat]={pid:S.prod,brand:S.brand};S.cat=k;S.prod=pid;S.brand="すべて";S.cmp=false;S.view="try";pickShade(i);view()}

if(S.sort==="new")rows.sort((a,b)=>a.p.releaseDate?(b.p.releaseDate?b.p.releaseDate.localeCompare(a.p.releaseDate):-1):b.p.releaseDate?1:0);

function view(){["rec","try","fav"].forEach(v=>$(v+"V").style.display=S.view===v?"block":"none");
$("sub").textContent=SUBT[S.view];
$("nav").innerHTML=[["rec","✨","おすすめ"],["try","💄","試す"],["fav","♡","お気に入り"]].map(t=>`<button class="${S.view===t[0]?"on":""}" aria-label="${t[2]}" aria-current="${S.view===t[0]?"page":"false"}" onclick="S.view='${t[0]}';view()"><i aria-hidden="true">${t[1]}</i>${t[2]}</button>`).join("");
if(S.view==="try")ui();
if(S.view==="rec"){
const fs=["すべて",...Object.values(D).map(d=>d.label)];
$("recV").innerHTML=`<p class="meta">ブランドや商品名・色番で探せます。受賞・ランキング情報は掲載当時の履歴です。</p><label class="meta" for="catalog-search">商品を検索</label><input id="catalog-search" type="search" value="${h(S.q)}" placeholder="ブランド・商品名・色番" oninput="S.q=this.value;renderRecommendations()" style="display:block;width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)"><div class="tabs">${fs.map(f=>`<button class="chip ${S.f===f?"on":""}" data-action="filter" data-category="${h(f)}">${h(f)}</button>`).join("")}</div><label class="meta" for="catalog-sort">並べ替え</label><select id="catalog-sort" onchange="S.sort=this.value;renderRecommendations()" style="margin:0 0 10px 8px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)">${[["default","掲載順"],["priceAsc","価格が安い順"],["priceDesc","価格が高い順"],["new","発売日が新しい順"],["evidence","受賞・掲載あり順"]].map(([value,label])=>`<option value="${value}" ${S.sort===value?"selected":""}>${label}</option>`).join("")}</select><div id="recommendation-results"></div>`;
renderRecommendations()}
if(S.view==="fav")renderFavorites()}
